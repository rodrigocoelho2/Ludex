# CI only: a throwaway SQL Server standing in for the NAS's shared-sql, on the same network name, so the real
# docker-compose.yml runs unchanged:  docker compose -f docker-compose.yml -f .github/ci/docker-compose.sql.yml up
# Never used on the NAS.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shared-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    networks:
      - sql-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  db-deploy:
    depends_on:
      sqlserver:
        condition: service_healthy
