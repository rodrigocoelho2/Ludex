name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# contents: write lets each job push its logs and screenshots to a ci-output-* branch for review.
permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SA_PASSWORD: Ludex-CI-2026!
  APP_PASSWORD: LudexAppCi2026x

jobs:
  build-test:
    name: Build, database and tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: Ludex-CI-2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ludex-CI-2026!' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: mkdir -p ci-output && dotnet restore Ludex.slnx 2>&1 | tee ci-output/1-restore.log

      - name: Build (Library, Sdk, WebApi, Website, UnitTest and the Ludex.Database dacpac)
        run: |
          set -o pipefail
          dotnet build Ludex.slnx -c Release --no-restore 2>&1 | tee ci-output/2-build.log
          dotnet build Ludex.Database/Ludex.Database.sqlproj -c Release 2>&1 | tee -a ci-output/2-build.log

      - name: Publish the dacpac to SQL Server (twice) with the app login
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          set -o pipefail
          exec > >(tee ci-output/3-dacpac.log) 2>&1
          dotnet tool install --global microsoft.sqlpackage
          dacpac=$(find Ludex.Database/bin -name 'Ludex.Database.dacpac' | head -n 1)
          for run in 1 2; do
            # The second publish must find nothing to change, and must keep the login working.
            sqlpackage /Action:Publish /SourceFile:"$dacpac" \
              /TargetServerName:localhost /TargetDatabaseName:Ludex \
              /TargetUser:sa /TargetPassword:"$SA_PASSWORD" /TargetTrustServerCertificate:True \
              /p:BlockOnPossibleDataLoss=True \
              /v:AppUser=ludex /v:AppPassword="$APP_PASSWORD"
          done

      - name: Test
        run: >-
          set -o pipefail;
          dotnet test Ludex.UnitTest/Ludex.UnitTest.csproj -c Release --no-build
          --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" --results-directory TestResults
          2>&1 | tee ci-output/4-test.log

      - name: Push the logs to the ci-output-build branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/push-output.sh ci-output-build

  compose:
    name: Docker Compose end to end (shared SQL Server)
    runs-on: ubuntu-latest
    env:
      LUDEX_API_KEY: ci-api-key-0123456789abcdef
      LUDEX_SETUP_KEY: ci-setup-key
    steps:
      - uses: actions/checkout@v4

      - name: Start a stand-in shared-sql, deploy the database, the WebApi and the Website
        run: |
          set -o pipefail
          mkdir -p ci-output
          printf 'SQL_SA_PASSWORD=%s\nSQL_APP_PASSWORD=%s\nLUDEX_API_KEY=%s\nLUDEX_SETUP_KEY=%s\n' \
            "$SA_PASSWORD" "$APP_PASSWORD" "$LUDEX_API_KEY" "$LUDEX_SETUP_KEY" > .env
          docker network create nas-net
          docker network create sql-net
          docker compose -f docker-compose.yml -f .github/ci/docker-compose.sql.yml up -d --build --wait website 2>&1 | tee ci-output/1-compose-up.log

      - name: Smoke test
        run: |
          exec > >(tee ci-output/2-smoke.log) 2>&1
          set -e
          base=http://localhost:5098
          for i in $(seq 1 60); do curl -fs -o /dev/null $base/create-account && break; sleep 2; done
          curl -fs $base/create-account | grep -q "<title>Set up Ludex · Ludex</title>" && echo "set-up page: ok"
          # Every stylesheet, script, font and image the pages link must be served.
          for page in /sign-in /create-account; do
            for f in $(curl -fs $base$page | grep -oE '(href|src)="/(css|js|fonts|img)/[^"?]+' | cut -d'"' -f2 | sort -u); do
              curl -fs -o /dev/null "$base$f" || { echo "missing: $f"; exit 1; }
            done
          done
          for f in /manifest.webmanifest /sw.js /js/app.js /css/app.css /fonts/barlow-condensed-latin-800-normal.woff2; do curl -fs -o /dev/null "$base$f" || { echo "missing: $f"; exit 1; }; done
          # Signed out, the app screens send a browser to sign in, and a page script gets a 401.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Accept: text/html' $base/library); echo "library (browser): $code"; test "$code" = "302"
          code=$(curl -s -o /dev/null -w '%{http_code}' $base/discover/results?q=zelda); echo "discover/results (script): $code"; test "$code" = "401"
          # The WebApi signs in as the ludex login, never as sa.
          docker compose logs db-deploy | grep -q "the WebApi signs in as ludex" && echo "db-deploy: login ready"
          echo ok

      - name: Install Playwright
        run: |
          pip install --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium > /dev/null

      - name: Three friends, their libraries, and every screen on a computer and a phone
        run: |
          set -o pipefail
          python .github/scripts/screenshots.py http://localhost:5098 ci-output/screenshots "$LUDEX_SETUP_KEY" 2>&1 | tee ci-output/3-screenshots.log

      - name: Push the logs and screenshots to the ci-output-compose branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker compose -f docker-compose.yml -f .github/ci/docker-compose.sql.yml ps -a > ci-output/9-compose-ps.log 2>&1 || true
          docker compose -f docker-compose.yml -f .github/ci/docker-compose.sql.yml logs --no-color > ci-output/9-compose-logs.log 2>&1 || true
          .github/scripts/push-output.sh ci-output-compose
