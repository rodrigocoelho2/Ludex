# Ludex on the NAS: the database deploy (runs once per "up" and exits), the WebApi and the Website.
# There is no SQL Server in this file: Ludex uses the shared one (container "shared-sql", network "sql-net"), like the
# other apps. db-deploy creates the Ludex database and its own "ludex" login there as sa; the WebApi only ever signs in
# as "ludex", which can't open the other apps' databases.
#
# Copy .env.example to .env next to this file and fill it in, then:  docker compose up -d --build
# (On the NAS the apps run as Portainer stacks: see "Deploying on the NAS" in the README.)

# The stack's name, fixed so the folder can be called anything: it prefixes the volume (ludex_keys), so the same name
# always finds the same data. Never change it on a running install.
name: ludex

services:
  # Publishes the database project (tables and stored procedures) and the ludex login, then exits: creates the Ludex
  # database the first time, applies schema changes on later deploys.
  db-deploy:
    build:
      context: .
      dockerfile: Ludex.Database/Dockerfile
    image: ludex-db-deploy:latest
    container_name: ludex-db-deploy
    restart: "no"
    networks:
      - sql-net
    environment:
      SQL_SERVER: ${SQL_SERVER:-shared-sql}
      SQL_DATABASE: Ludex
      SQL_USER: sa
      SQL_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env (the shared SQL Server's sa password)}
      SQL_APP_USER: ludex
      SQL_APP_PASSWORD: ${SQL_APP_PASSWORD:?Set SQL_APP_PASSWORD in .env (the ludex login's password)}
    logging: &logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # The engine: accounts, the IGDB catalog, libraries and friends. Not published on any port: only the website reaches
  # it, over the stack's own network. It reaches out to Twitch and IGDB, and to Steam, when the credentials are set.
  webapi:
    build:
      context: .
      dockerfile: Ludex.WebApi/Dockerfile
    image: ludex-webapi:latest
    container_name: ludex-webapi
    restart: unless-stopped
    depends_on:
      db-deploy:
        condition: service_completed_successfully
    networks:
      - default
      - sql-net
    environment:
      ConnectionStrings__Ludex: "Server=${SQL_SERVER:-shared-sql},1433;Database=Ludex;User Id=ludex;Password=${SQL_APP_PASSWORD};TrustServerCertificate=True"
      Ludex__ApiKey: ${LUDEX_API_KEY:?Set LUDEX_API_KEY in .env}
      # IGDB, through a Twitch application (https://dev.twitch.tv/console). Empty: the short built-in list of games.
      Ludex__IgdbClientId: ${IGDB_CLIENT_ID:-}
      Ludex__IgdbClientSecret: ${IGDB_CLIENT_SECRET:-}
      # The Steam import (Settings → Import from Steam): a Steam Web API key. Empty: the import is off.
      Ludex__SteamApiKey: ${STEAM_API_KEY:-}
      # Wishlist prices and alerts (IsThereAnyDeal). Empty: no prices.
      Ludex__ItadApiKey: ${ITAD_API_KEY:-}
      Ludex__PriceCountry: ${LUDEX_PRICE_COUNTRY:-PT}
      DOTNET_gcServer: "0"
      TZ: ${TIME_ZONE:-Europe/Lisbon}
    cpus: ${LUDEX_CPUS:-1}
    mem_limit: ${LUDEX_WEBAPI_MEMORY:-384m}
    logging: *logging

  # Ludex (the app): http://<nas-ip>:5098 — and https://ludex.<your-domain> through Nginx Proxy Manager.
  website:
    build:
      context: .
      dockerfile: Ludex.Website/Dockerfile
    image: ludex-website:latest
    container_name: ludex-website
    restart: unless-stopped
    depends_on:
      - webapi
    ports:
      - "${LUDEX_PORT:-5098}:8080"
    environment:
      LudexApi__Url: http://webapi:8080/
      LudexApi__ApiKey: ${LUDEX_API_KEY:?Set LUDEX_API_KEY in .env}
      # Asked for only when creating the FIRST account (the admin), so nobody else on the network can claim it.
      Website__SetupKey: ${LUDEX_SETUP_KEY:?Set LUDEX_SETUP_KEY in .env}
      # false = only the first account can be created from the sign-in page.
      Website__AllowRegistration: ${LUDEX_ALLOW_REGISTRATION:-true}
      Website__DiscordClientId: ${DISCORD_CLIENT_ID:-}
      Website__DiscordClientSecret: ${DISCORD_CLIENT_SECRET:-}
      Website__TimeZone: ${TIME_ZONE:-Europe/Lisbon}
      DOTNET_gcServer: "0"
      TZ: ${TIME_ZONE:-Europe/Lisbon}
    cpus: ${LUDEX_CPUS:-1}
    mem_limit: ${LUDEX_WEBSITE_MEMORY:-384m}
    volumes:
      - keys:/keys                          # session keys: "keep me signed in" survives updates
    networks:
      - default                             # talks to the webapi
      - nas-net                             # Nginx Proxy Manager reaches it at http://ludex-website:8080
    logging: *logging

networks:
  default:      # private network of this stack (the WebApi is not on nas-net)
  # The shared SQL Server's network (created by the shared-sql stack).
  sql-net:
    name: sql-net
    external: true
  # Shared network on the NAS; create it once with:  docker network create nas-net
  nas-net:
    external: true

volumes:
  keys:
